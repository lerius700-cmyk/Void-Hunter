name: tests

# Run the full pytest suite on every push and pull_request to the lines
# that matter: `master` (the old v1.6.3 line) and
# `bloquec-67-goliath-port` (the release line, where v1.7.x and v1.8.x
# live and where the binary is built).
#
# The release line had NO CI until now, and that is how the CRLF defect
# survived: the release line has the `.gitattributes` that makes a
# checkout LF while the generator wrote CRLF, so the test WOULD have
# failed on this Linux runner -- but the gate never ran there. On
# `master`, which has no `.gitattributes`, the bug does not reproduce.
# Two errors cancelling each other out.
#
# `workflow_dispatch` validates any branch on demand: a branch in
# flight can be checked without auto-firing a gate in the middle of
# someone's work.
#
# The .build-venv pattern (uv-managed) installs pygame + numpy from
# requirements.txt.

on:
  push:
    branches: [master, bloquec-67-goliath-port]
  pull_request:
    branches: [master, bloquec-67-goliath-port]
  workflow_dispatch:

jobs:
  pytest:
    # The suite runs on WINDOWS, and that is not a preference: the artifact
    # this project ships is a Windows .exe, so Windows is the reference
    # platform.
    #
    # The deciding reason is the GOLDEN FRAMES (BLOQUE 75 Phase 2). They
    # carry the HUD, and the HUD draws the score with
    # SysFont("consolas", ...) -- a SYSTEM font, not a bundled one. On
    # Linux that font does not exist, pygame falls back to whatever it
    # has, and the score pixels change: the golden frames stop matching
    # byte for byte and the Phase 2 proof turns RED for a reason that has
    # nothing to do with the code. The goldens are Windows BY CONSTRUCTION,
    # so the suite that verifies them has to run where they were captured.
    #
    # It also fixes the runtime by the root: on Linux the golden captures
    # cost ~45 s each (12 of them) and the job blew its 15-minute budget;
    # on Windows the whole suite takes ~104 s. The 25 minutes is the same
    # headroom the gates job gets, not a tighter fit.
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # The FULL history: the BLOQUE 75 Phase 1 gate measures the phase
          # RANGE (base..HEAD), so it needs the base commit. The default
          # checkout is shallow (depth 1) and does not have it.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install pygame + numpy + pytest via system pip
        # CI runs on Windows; we just need pygame + numpy. No PyInstaller
        # in CI (it's a Windows-only build tool).
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Set SDL_VIDEODRIVER=dummy (headless)
        # pygame needs a video driver even for headless tests; the dummy
        # driver is part of the SDL2 package.
        #
        # The default shell of a Windows runner is PowerShell, not bash, so
        # the `echo ... >> $GITHUB_ENV` form does NOT apply here:
        # `$GITHUB_ENV` is a bash variable, and PowerShell would read it as
        # an empty file name. Same two variables, written the way
        # PowerShell writes them.
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "SDL_VIDEODRIVER=dummy"
          Add-Content -Path $env:GITHUB_ENV -Value "SDL_AUDIODRIVER=dummy"

      - name: Run pytest
        run: |
          python -m pytest --tb=short

  gates:
    # The golden frames carry the HUD, and the HUD draws the score with
    # SysFont("consolas") -- a SYSTEM font, not a bundled one. On a Linux
    # runner that font is missing, pygame falls back to its default and the
    # score pixels change: the Phase 2 gate would be RED on every run for a
    # reason that has nothing to do with the code. So the gates run where
    # the goldens were captured.
    #
    # The timeout is 25 and not 15 because the Phase 2 gate's worst case is
    # 1380 s (3 git calls of 60 s + 4 budgets of 300 s). The pytest job kills
    # at 900 s; here the gate reports its OWN diagnosis instead of dying
    # without one. A healthy run takes ~16 s.
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # The FULL history: the gates measure the phase RANGE (base..HEAD).
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Set SDL_VIDEODRIVER=dummy (headless)
        # The default shell of a Windows runner is PowerShell, not bash, so
        # the `echo ... >> $GITHUB_ENV` of the pytest job does NOT apply
        # here: `$GITHUB_ENV` is a bash variable, and PowerShell would read
        # it as an empty file name. Same two variables, written the way
        # PowerShell writes them.
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "SDL_VIDEODRIVER=dummy"
          Add-Content -Path $env:GITHUB_ENV -Value "SDL_AUDIODRIVER=dummy"

      - name: Run the gates that apply to this branch
        run: python tools/sprite_pipeline/gate_ci.py
