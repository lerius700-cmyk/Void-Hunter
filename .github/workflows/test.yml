name: tests

# Run the full pytest suite on every push and pull_request to the lines
# that matter: `master` (the old v1.6.3 line) and
# `bloquec-67-goliath-port` (the release line, where v1.7.x and v1.8.x
# live and where the binary is built).
#
# The release line had NO CI until now, and that is how the CRLF defect
# survived: the release line has the `.gitattributes` that makes a
# checkout LF while the generator wrote CRLF, so the test WOULD have
# failed on this Linux runner -- but the gate never ran there. On
# `master`, which has no `.gitattributes`, the bug does not reproduce.
# Two errors cancelling each other out.
#
# `workflow_dispatch` validates any branch on demand: a branch in
# flight can be checked without auto-firing a gate in the middle of
# someone's work.
#
# The .build-venv pattern (uv-managed) installs pygame + numpy from
# requirements.txt.

on:
  push:
    branches: [master, bloquec-67-goliath-port]
  pull_request:
    branches: [master, bloquec-67-goliath-port]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install pygame + numpy + pytest via system pip
        # CI runs on Linux; we just need pygame + numpy. No PyInstaller
        # in CI (it's a Windows-only build tool).
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Set SDL_VIDEODRIVER=dummy (headless)
        # pygame needs a video driver even for headless tests; the dummy
        # driver is part of the SDL2 package.
        run: |
          echo "SDL_VIDEODRIVER=dummy" >> $GITHUB_ENV
          echo "SDL_AUDIODRIVER=dummy" >> $GITHUB_ENV

      - name: Run pytest
        run: |
          python -m pytest --tb=short
