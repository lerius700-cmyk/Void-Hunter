# BLOQUE 75: SPEC of the MINE_ASTEROID animation set. Hand-edited.
#
# The special set: four visual states, one of them with five VARIANTS,
# a death clip the runtime never plays, and TWO canvas sizes.
#
# The mine's clips are STATIC, not animations: `closed` holds five
# VARIANTS and `open1`/`open2`/`open3` hold a single frame each. The
# frame is chosen by the mine's STATE (mine_state), never advanced by
# time -- `_update_mine_asteroid()` returns before the animation tick.
# So NO fps applies to any of them: they carry the loader's default, and
# declaring one would be a false declaration. The `death` clip is
# `mode = "archive"` and is never played either, so it declares none.
# Because NONE of them advances, every clip declares `loop = false` and
# `on_end = "hold"`: the manifest now says what the runtime does.
# `scale = [1.05, 1.05]`: the runtime draws EVERY enemy scaled by 1.05
#   and truncates the size: int(64 * 1.05) == 67. The compositor
#   reproduces that EXACTLY, so the pipeline and the runtime agree --
#   without it the pipeline would draw the sprite 5% smaller than the
#   runtime does.

[meta]
name        = "MINE_ASTEROID"
version     = 1
canvas      = [64, 64]
anchor      = [32, 32]
cut_margin  = 0

[[clips]]
id       = "closed"
dir      = "closed"
frames   = 5
distinct = 5
mode     = "variants"
loop     = false
on_end   = "hold"
scale_tolerance = 0.25

[[clips]]
id       = "open1"
dir      = "open1"
frames   = 1
distinct = 1
mode     = "state"
loop     = false
on_end   = "hold"
scale_tolerance = 0.10

[[clips]]
id       = "open2"
dir      = "open2"
frames   = 1
distinct = 1
mode     = "state"
loop     = false
on_end   = "hold"
scale_tolerance = 0.10

# open3 is the TERMINAL state and reuses the `open/` directory: the
# shipped runtime loads the open3 art from THERE (enemy.py:469-473).
[[clips]]
id       = "open3"
dir      = "open"
frames   = 1
distinct = 1
mode     = "state"
loop     = false
on_end   = "hold"
scale_tolerance = 0.10

[[clips]]
id       = "death"
dir      = "death"
frames   = 10
distinct = 1
mode     = "archive"
loop     = false
on_end   = "hold"
canvas   = [32, 32]
scale_tolerance = 0.10

[[parts]]
id    = "body"
draw  = "frames"
pivot = "fixed"
# The runtime draws every enemy scaled by 1.05, truncated: int(64 * 1.05) == 67.
# The compositor reproduces that EXACTLY, so the pipeline and the runtime agree.
scale = [1.05, 1.05]
z     = 0
